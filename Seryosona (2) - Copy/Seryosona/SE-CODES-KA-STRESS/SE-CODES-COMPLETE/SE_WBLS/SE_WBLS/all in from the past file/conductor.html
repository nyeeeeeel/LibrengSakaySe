<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor Dashboard</title>
    <link rel="stylesheet" type="text/css" href="conductorstyle.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>

    <!-- Header -->
    <header>
        <div class="top-bar">
            <img src="Pictures/QCLogo.png.png" alt="CityBus Logo" class="header-logo">
        </div>
    </header>    

    <!-- Main container -->
    <div class="container">

      
        <!-- Main content section -->
        <div class="content">

            <!-- Map section with new logo above -->
            <div class="map-section">
                <div class="map-header">
                    <img src="Pictures/locationmainlogo.png" alt="CityBus Logo" class="map-logo">
                    <h3>Map</h3>
                </div>
                
            </div>

            <!-- Form section -->
            <div class="form-section">

                <!-- Estimated arrival input -->
                <div class="input-box">

                    <label><b>Estimated Arrival:</b></label>
                    <input type="text" placeholder="Enter Estimated Time" />
                </div>

                <!-- Notes textarea -->
                <div class="textarea-box">
                    <label><b>Additional Notes:</b></label>
                    <textarea rows="4" placeholder="Enter Additional Notes"></textarea>
                </div>

                <!-- Save button -->
                <button class="save-btn">Save</button>

                <!-- Notes section -->
                <div class="notes-box">
                    <label><b>Notes:</b></label>
                    <textarea rows="3" placeholder="Add Notes Here"></textarea>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">TERMS OF SERVICE ︱ PRIVACY POLICY</a>
        </div>
        <div class="social-icons">
            <a href="#" class="fa fa-facebook"></a>
            <a href="#" class="fa fa-twitter"></a>
            <a href="#" class="fa fa-instagram"></a>
        </div>
    </footer>    

</body>
</html>
