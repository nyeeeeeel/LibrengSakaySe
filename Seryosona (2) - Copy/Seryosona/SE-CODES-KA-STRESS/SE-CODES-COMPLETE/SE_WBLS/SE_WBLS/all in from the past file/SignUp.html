<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityBus Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="banner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <img src="Pictures/QCLogo.png.png" alt="CityBus Logo" class="header-logo">
        </div>
    </header>   

    <!-- Main Layout -->
    <main>
        <!-- Left Banner Section -->
        <section class="banner1">
            <h1 class="banner-text1">Never Miss a Seat -<br>Check Availability Now!</h1>
        </section>

        <!-- Right Login Section -->
        <section class="login-container">
            <div class="logo">
                <img src="Pictures/locationmainlogo.png" alt="CityBus Logo">
                <h1>CITYBUS</h1>
            </div>

            <form class="login-form">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>

                <button type="submit" class="signup-button">Sign Up</button>
            </form>
        </section>
    </main>

    <!--NOTIFICATION-->

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const signupForm = document.querySelector(".login-form");
    
            signupForm.addEventListener("submit", function (event) {
                event.preventDefault(); // Prevent default form submission
    
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirm-password").value;
    
                // Check if email contains "@"
                if (!email.includes("@")) {
                    showNotification("Email must contain '@'.");
                    return;
                }
    
                // Validate password match
                if (password !== confirmPassword) {
                    showNotification("Passwords do not match.");
                    return;
                }
    
                // Show success message
                showNotification("Successfully Signed Up!", function () {
                    window.location.href = "Login.html"; // Redirect to Login page
                });
            });
    
            // Function to show a notification at the top
            function showNotification(message, callback = null) {
                // Remove existing notification if present
                const existingNotification = document.querySelector(".notification-container");
                if (existingNotification) {
                    existingNotification.remove();
                }
    
                // Create notification container
                const notification = document.createElement("div");
                notification.className = `notification-container`;
                notification.textContent = message;
    
                // Append to body
                document.body.appendChild(notification);
    
                // Remove notification after 2 seconds and execute callback if provided
                setTimeout(() => {
                    notification.remove();
                    if (callback) callback();
                }, 2000);
            }
        });
    </script>
    
    <style>
    /* Notification Styles */
    .notification-container {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        color: black;
        padding: 12px 20px;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        min-width: 250px;
        max-width: 400px;
        border-radius: 5px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        z-index: 1000;
    }
    </style>
    


    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <a href="#">TERMS OF SERVICE ︱ PRIVACY POLICY</a>
        </div>
        <div class="social-icons">
            <a href="#" class="fa fa-facebook"></a>
            <a href="#" class="fa fa-twitter"></a>
            <a href="#" class="fa fa-instagram"></a>
        </div>
    </footer>
     
</body>
</html>
