<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q City Bus Service / Libreng Sakay</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="adminstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <!-- Header Section with Date and Logo -->
    <div class="header">
        <img src="Pictures/QCLogo.png.png" alt="Logo" class="logo">
        <div>
        </div>
    </div>
    </div>

    <!-- Main Banner Section -->
    <div class="banner">
        <img src="Pictures/linebr.png" alt="Q City Bus Service Banner" class="banner-image">
        <h1>Q City Bus Service / <i>Libreng Sakay</i></h1>
    </div>
    

    <!-- Main Content Section -->
    <div class="main-container">
        <!-- Sidebar for navigation -->
        <div class="sidebar">
            <div class="action-box">
                <h3>Manage Bus</h3>
                <input type="text" placeholder="Enter Bus ID" />
                <input type="text" placeholder="Enter Bus Name" />
                <input type="text" placeholder="Enter Route" />
                <input type="text" placeholder="Enter Time" />
                <button>Add</button>
                <button>Edit</button>
                <button>Delete</button>
            </div>
        </div>
        
        <!-- Main content and map area -->
        <div class="content">
            <div class="top-btns">
                <div class="top-btn"></div>
                <div class="top-btn"></div>
                <div class="top-btn"></div>
                <div class="map-icon"></div>
            </div>
            <div class="left-panel">
                <!-- Add a logo inside the circle -->
                <h3>
                    <div class="logo-container">
                        <img src="Pictures/mainlogo.png" alt="Bus Logo" />
                    </div>
                    Add Bus Info
                </h3>
                
            
                <!-- Stylish Input Fields -->
                <input type="text" id="busId" placeholder="Enter Bus ID" />
                <input type="text" id="busName" placeholder="Enter Bus Name" />
                <input type="text" id="busRoute" placeholder="Enter Route" />
                <input type="text" id="busTime" placeholder="Enter Time" />
                
                <!-- Modern Button Design -->
                <button onclick="addBus()">Add Bus</button>
            </div>
            
            
            <div class="info-panel">
                <table class="data-grid" id="busTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Route</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Bus data will be dynamically added here -->
                    </tbody>
                </table>
            </div>
                        
        </div>

        <!-- Map Section -->
        <div class="map-container">
            <iframe 
                width="100%" 
                height="100%" 
                src="https://www.google.com/maps?q=Quezon+City&output=embed" 
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#">TERMS OF SERVICE ︱ PRIVACY POLICY</a>
        </div>
        <div class="social-icons">
            <a href="#" class="fa fa-facebook"></a>
            <a href="#" class="fa fa-twitter"></a>
            <a href="#" class="fa fa-instagram"></a>
        </div>
    </footer>    

</body>
</html>
